<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="dsh-chat-token" content="__DSH_CHAT_TOKEN__" />
    <title>dsh-chat</title>
    <script>
      // 内嵌模式：DSH 右栏 iframe 会带 ?embed=1 打开本页，此时隐藏我们自己的侧栏与顶栏。
      // 写在样式表之前，避免先画出再隐藏的闪动。
      try {
        if (new URLSearchParams(location.search).get('embed') === '1') {
          document.documentElement.classList.add('embed');
        }
      } catch (error) {
        /* 老浏览器忽略即可 */
      }
    </script>
    <link rel="stylesheet" href="__DSH_CHAT_PATH__/style.css" />
  </head>
  <body>
    <aside id="sidebar">
      <div class="side-head">
        <span class="brand">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              d="M4 15.5c3-1 4.5-3.5 5-7 2.5 1 4 3 4.5 5.5 1.8-.6 3-2 3.5-4 2 1.8 3 4.2 3 6.5 0 .8-.1 1.6-.3 2.3-1.6 1.4-3.6 2.2-5.7 2.2-3.7 0-6.9-2.2-8.5-5.5z"
              fill="currentColor"
              opacity="0.9"
            />
          </svg>
          <span>dsh-chat</span>
        </span>
        <button id="collapse-side" class="ghost" title="收起侧栏" aria-label="收起侧栏">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
      </div>

      <div class="workspace-bar">
        <select id="workspace-filter" class="workspace-select" title="按工作区筛选"></select>
        <button id="workspace-add" class="ghost" title="新建工作区" aria-label="新建工作区">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
        <button id="workspace-rename" class="ghost" title="重命名当前工作区" aria-label="重命名当前工作区">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round">
            <path d="M4 20h4l10-10a2.8 2.8 0 10-4-4L4 16v4z" />
          </svg>
        </button>
        <button id="workspace-delete" class="ghost" title="删除当前工作区（会话回到未分组）" aria-label="删除当前工作区">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M5 7h14M9 7V5h6v2M7 7l1 13h8l1-13" />
          </svg>
        </button>
      </div>

      <button id="new-chat" class="new-chat">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>开启新对话</span>
      </button>

      <div class="side-label">对话历史</div>
      <div id="session-list" class="session-list"></div>

      <input id="import-file" type="file" accept="application/json,.json" hidden />

      <div class="side-foot">
        <button id="export" class="ghost" title="导出全部对话">导出</button>
        <button id="import" class="ghost" title="导入对话">导入</button>
        <button id="clear-all" class="ghost" title="清空全部对话（不可恢复）">清空</button>
        <button id="theme" class="ghost" title="切换主题" aria-label="切换主题">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="8" />
            <path d="M12 4a8 8 0 000 16z" fill="currentColor" stroke="none" />
          </svg>
        </button>
      </div>
    </aside>

    <main id="main">
      <header id="topbar">
        <button id="toggle-side" class="ghost" title="展开侧栏" aria-label="展开侧栏">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16" />
          </svg>
        </button>
        <h1 id="chat-title">新对话</h1>
        <div class="topbar-right">
          <span id="badge-key" class="chip warn" hidden>未配置 API Key</span>
          <span id="badge-model" class="chip"></span>
        </div>
      </header>

      <section id="messages" class="messages"></section>

      <button id="scroll-down" class="scroll-down" title="回到底部" aria-label="回到底部" hidden>
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <footer id="dock">
        <div id="attachments" class="attachments"></div>
        <div class="composer">
          <textarea id="input" rows="1" placeholder="给 dsh-chat 发送消息"></textarea>
          <div class="composer-bar">
            <div class="pills">
              <button id="toggle-thinking" class="pill" type="button">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
                  <path d="M12 3.5l1.7 4.6 4.6 1.7-4.6 1.7L12 16.1l-1.7-4.6L5.7 9.8l4.6-1.7L12 3.5z" />
                  <path d="M18.5 15.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z" />
                </svg>
                <span>深度思考</span>
              </button>
              <button id="toggle-search" class="pill" type="button">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
                  <circle cx="12" cy="12" r="8.5" />
                  <path d="M3.5 12h17M12 3.5c2.4 2.6 3.6 5.4 3.6 8.5S14.4 18.4 12 20.5c-2.4-2.1-3.6-5.4-3.6-8.5S9.6 6.1 12 3.5z" />
                </svg>
                <span>智能搜索</span>
              </button>
            </div>
            <div class="composer-right">
              <button id="attach" class="icon" title="添加文件或图片" aria-label="添加文件或图片">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
                  <path d="M12 16V4M8 8l4-4 4 4" />
                  <path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" />
                </svg>
              </button>
              <button id="send" class="send" title="发送" aria-label="发送">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 19V5M6 11l6-6 6 6" />
                </svg>
              </button>
              <button id="stop" class="stop" title="停止生成" aria-label="停止生成" hidden>
                <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" aria-hidden="true">
                  <rect x="7" y="7" width="10" height="10" rx="2" />
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="disclaimer">内容由 AI 生成，请仔细甄别</div>
        <input id="file-input" type="file" multiple hidden />
      </footer>
    </main>

    <div id="move-menu" class="move-menu" hidden></div>

    <aside id="search-panel" class="search-panel" hidden>
      <header class="panel-head">
        <h2>搜索结果</h2>
        <button id="close-panel" class="ghost" title="关闭" aria-label="关闭">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </header>
      <div id="search-list" class="search-list"></div>
    </aside>

    <script type="application/json" id="boot">__DSH_CHAT_STATE__</script>
    <script type="module" src="__DSH_CHAT_PATH__/app.js"></script>
  </body>
</html>
