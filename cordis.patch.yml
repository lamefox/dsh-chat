# dsh-chat: an independent chat window served by the DSH web server.
#
# The plugin mounts one host-side plugin that registers /chat (page) and
# /chat/api/* (proxy) on the existing web server, then opens that URL in a
# separate browser window at startup.
#
# Install:  dsh plugin --profile web add @lamefox/dsh-chat
# Remove:   dsh plugin --profile web remove @lamefox/dsh-chat
- insert:
    - id: dsh-chat
      name: '@lamefox/dsh-chat'
      config:
        path: /chat
        auth: auto          # auto | apiKey | account
        model: deepseek-flash
        openBrowser: once
